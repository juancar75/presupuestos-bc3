name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --workspace
      - name: Demo reproducible
        run: cargo run -p ppto-cli -- demo

  licencias:
    name: Licencias y avisos de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  dco:
    name: Firma DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Comprobar Signed-off-by
        run: |
          faltan=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk 'NF==1 {print $1}')
          if [ -n "$faltan" ]; then
            echo "Commits sin Signed-off-by (usa git commit -s):"; echo "$faltan"; exit 1
          fi
