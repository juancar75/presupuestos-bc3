name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sintaxis de los scripts de PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $mal = 0
          Get-ChildItem -Recurse -Filter *.ps1 scripts | ForEach-Object {
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err) { $err | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }; $mal++ }
          }
          if ($mal) { exit 1 }
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --workspace
      - name: Demo reproducible
        run: cargo run -p ppto-cli -- demo

  licencias:
    name: Licencias y avisos de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: |
          set +e
          cargo deny --color never --all-features check > deny.log 2>&1
          r=$?
          cat deny.log
          if [ $r -ne 0 ]; then
            grep -E -A6 '^(error|failed)' deny.log | grep -v '^--$' | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            [ -s deny.log ] && tail -5 deny.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $r

  dco:
    name: Firma DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar Signed-off-by
        run: |
          faltan=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk 'NF==1 {print $1}')
          if [ -n "$faltan" ]; then
            echo "Commits sin Signed-off-by (usa git commit -s):"; echo "$faltan"; exit 1
          fi
