[workspace]
resolver = "3"
members = ["crates/ppto-core", "crates/ppto-db", "crates/ppto-cli", "crates/ppto-gui"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/juancar75/presupuestos-bc3"
authors = ["Juan Carlos Cortés Molinera y colaboradores"]

[workspace.dependencies]
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
ppto-core = { path = "crates/ppto-core" }
ppto-db = { path = "crates/ppto-db" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
