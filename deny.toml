# Comprobación de licencias y avisos de seguridad (regla 11 del proyecto).
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    # Boost: permisiva y compatible con GPL (clipboard-win, error-code; portapapeles en Windows)
    "BSL-1.0",
    # Zero-Clause BSD: dominio público funcional (roman-numerals-rs, vía Typst)
    "0BSD",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Fuentes tipográficas incrustadas por egui. Se distribuyen como datos
# agregados, no como código derivado; ver THIRD-PARTY-NOTICES.md.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Certificados raíz de Mozilla (datos, no código) usados para verificar TLS
# en el modo directo del asistente; licencia de datos permisiva.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# Avisos heredados de Typst (ppto-pdf). Revisados el 2026-10-11; revisar al
# actualizar Typst. El PDF solo compila nuestra plantilla y datos propios.
ignore = [
    # quick-xml 0.38 vía hayagriva/citationberg: lectura de estilos de citas
    # bibliográficas (CSL). La plantilla no usa bibliografía ni lee XML externo.
    { id = "RUSTSEC-2026-0194", reason = "solo estilos CSL de bibliografía, no usados" },
    { id = "RUSTSEC-2026-0195", reason = "solo estilos CSL de bibliografía, no usados" },
    # Sin mantenimiento, sin fallo conocido: dependencias internas de Typst.
    { id = "RUSTSEC-2025-0141", reason = "bincode vía syntect (resaltado de código de Typst)" },
    { id = "RUSTSEC-2024-0436", reason = "paste (macro) vía biblatex de Typst" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz vía krilla/typst-pdf; Typst lo sustituirá" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser vía Typst" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust vía syntect de Typst" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml vía serde_yaml de hayagriva (bibliografía de Typst), no usado" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
