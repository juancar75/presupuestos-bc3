[package]
name = "ppto-legalizacion-app"
description = "Aplicación independiente de costes de legalización (RITE, PCI): ventana propia, sola o lanzada desde el presupuestador"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "legalizacion"
path = "src/main.rs"

[dependencies]
ppto-core.workspace = true
ppto-bc3.workspace = true
ppto-biblioteca.workspace = true
ppto-legalizacion.workspace = true
rust_decimal.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"

[lints]
workspace = true
