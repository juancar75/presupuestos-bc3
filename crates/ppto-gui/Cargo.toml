[package]
name = "ppto-gui"
description = "Interfaz de escritorio básica (prototipo) del gestor de presupuestos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ppto-gui"
path = "src/main.rs"

[dependencies]
ppto-core.workspace = true
ppto-db.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36"
rfd = "0.17"

[lints]
workspace = true
